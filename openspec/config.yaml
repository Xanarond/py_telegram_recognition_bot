schema: spec-driven

# Project context
context: |
  Tech stack: Python 3.8+, asyncio, Telegram Bot API
  Databases: MongoDB (content), PostgreSQL (users), ChromaDB (vectors)
  AI: Anthropic Claude API for content analysis
  Architecture: Modular with handlers, analyzers, storage, and generators
  Domain: Telegram bot for AI-powered web content analysis and knowledge retrieval
  Conventions: Async/await patterns, Russian comments, type hints
  Deployment: Docker with docker-compose

